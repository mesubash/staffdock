name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.14.10 check staffdock scripts
      - run: uvx ruff@0.14.10 format --check staffdock scripts

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn build

  e2e:
    # Fresh bench + site via the same script developers use, then every role through the app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:v1.21.0
        ports: ["1025:1025"]
    env:
      BENCH_PARENT: ${{ github.workspace }}/../bench
      DB_HOST: 127.0.0.1
      DB_ROOT_PASSWORD: root
      REDIS_CACHE: redis://127.0.0.1:6379
      REDIS_QUEUE: redis://127.0.0.1:6379
      MAIL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -yq mariadb-client
          npm install -g yarn@1.22.22
          pip install frappe-bench

      - name: MariaDB character set
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Set up bench, site and demo data
        run: bash scripts/dev-setup.sh

      - name: Start bench
        working-directory: ${{ env.BENCH_PARENT }}/frappe-bench
        run: |
          nohup bench start > bench.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/method/ping && exit 0
            sleep 3
          done
          echo "bench did not start"; tail -50 bench.log; exit 1

      - name: End-to-end check
        run: |
          export STAFFDOCK_URL=http://127.0.0.1:8000
          export STAFFDOCK_TEST_PASSWORD=$(sed -n 's/^test_password=//p' "$BENCH_PARENT/site-credentials.txt")
          export STAFFDOCK_ADMIN_PASSWORD=$(sed -n 's/^password=//p' "$BENCH_PARENT/site-credentials.txt")
          python3 scripts/e2e_check.py

      - name: Bench log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-log
          path: ${{ env.BENCH_PARENT }}/frappe-bench/bench.log
