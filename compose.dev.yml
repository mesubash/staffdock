# Local development only. Based on frappe_docker v4.1.1 devcontainer-example.
# Usage: docker compose -f compose.dev.yml up -d
#        docker compose -f compose.dev.yml exec frappe bash
services:
  mariadb:
    image: docker.io/mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: docker.io/redis:alpine

  redis-queue:
    image: docker.io/redis:alpine

  # Catches every email the dev site sends: http://localhost:8025
  mailpit:
    image: docker.io/axllent/mailpit:v1.21.0
    ports:
      - 127.0.0.1:8025:8025

  frappe:
    image: docker.io/frappe/bench:latest
    command: sleep infinity
    environment:
      - SHELL=/bin/bash
    volumes:
      - .:/workspace:cached
    working_dir: /workspace/development
    ports:
      - 127.0.0.1:8000:8000
      - 127.0.0.1:9000:9000

volumes:
  mariadb-data:
